---
# Setup control node with Ansible
- name: Install Ansible core
  apt:
    name:
      - ansible
      - ansible-core
    state: present

- name: Install Python dependencies for Ansible
  pip:
    name:
      - paramiko
      - jinja2
      - pyyaml
    state: present

