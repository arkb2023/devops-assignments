---
- name: Update apt cache
  apt: update_cache=yes

- name: Install Docker
  apt:
    name:
      - docker.io
      - docker-compose
    state: present

- name: Start Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Reboot for docker group
  reboot:

