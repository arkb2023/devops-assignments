[defaults]
# Project2 Ansible Configuration
inventory = ./inventory/hosts.ini
roles_path = ./roles
playbook_dir = ./playbooks
host_key_checking = False
retry_files_enabled = False
forks = 10
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./cache
fact_caching_timeout = 86400
log_path = ./logs/ansible.log

# Colors and display
stdout_callback = yaml
display_skipped_hosts = False
display_ok_hosts = False
command_warnings = False

# SSH settings (optimized for Multipass + AWS)
ssh_args = -o ControlMaster=auto -o ControlPersist=3600s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
ssh_executable = ssh
transport = smart
pipelining = True
scp_if_ssh = True

# Vault (if needed later)
# vault_password_file = ./vault_pass.txt

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[inventory]
enable_plugins = host_list, yaml, ini, toml
flatten_multiline = False

[ssh_connection]
#ssh_args = -C -o ControlMaster=auto -o ControlPersist=3600s -o KbdInteractiveAuthentication=no -o PreferredAuthentications=gssapi-with-mic,gssapi,key,keyboard-interactive,password -o PasswordAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
#ssh_args = -i /home/user/workspace/devops-assignments/project2/multipass/ssh-keys/multipass_key -o StrictHostKeyChecking=no
ssh_args = -i ../multipass/ssh-keys/multipass_key -o StrictHostKeyChecking=no
pipelining = True
control_path_dir = ./ssh_control

[galaxy]
server_list = automation_hub, galaxy

[cache]
fact_caching_connection = ./cache
