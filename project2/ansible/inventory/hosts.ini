# Unified Ansible Inventory for Project2 - MULTIPASS + AWS

# ========== MULTIPASS LOCAL ==========
[jenkins_master]
worker1 ansible_host=10.184.96.149 ansible_user=ubuntu

[k3s_control_plane]
worker2 ansible_host=10.184.96.124 ansible_user=ubuntu

[k3s_workers]
worker3 ansible_host=10.184.96.168 ansible_user=ubuntu
worker4 ansible_host=10.184.96.112 ansible_user=ubuntu

# ========== AWS TEMPLATE ==========
# Uncomment for AWS Migration
# [jenkins_master]
# worker1 ansible_host=EC2_IP1 ansible_user=ubuntu ansible_ssh_private_key_file=./terraform/modules/ec2/worker1-key.pem
# 
# [k3s_control_plane]
# worker2 ansible_host=EC2_IP2 ansible_user=ubuntu ansible_ssh_private_key_file=./terraform/modules/ec2/worker2-key.pem
# 
# [k3s_workers]
# worker3 ansible_host=EC2_IP3 ansible_user=ubuntu ansible_ssh_private_key_file=./terraform/modules/ec2/worker3-key.pem
# worker4 ansible_host=EC2_IP4 ansible_user=ubuntu ansible_ssh_private_key_file=./terraform/modules/ec2/worker4-key.pem

# ========== GROUPS ==========
[k3s_cluster:children]
k3s_control_plane
k3s_workers

[all_nodes:children]
jenkins_master
k3s_cluster

# ========== COMMON VARIABLES ==========
[all:vars]
# SSH settings (works for both Multipass and AWS)
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

# Become (sudo) settings
ansible_become=yes
ansible_become_method=sudo
ansible_become_user=root

# K3s cluster settings
k3s_version=stable
k3s_channel=stable
k3s_install_dir=/usr/local/bin
kubeconfig_path=/etc/rancher/k3s/k3s.yaml
