[controller]
localhost ansible_connection=local ansible_user=ubuntu

[jenkins_master]
localhost ansible_connection=local ansible_user=ubuntu

[k3s_control_plane]
worker2 ansible_host=worker2 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/.ssh/id_rsa

[k3s_workers]
worker3 ansible_host=worker3 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/.ssh/id_rsa
worker4 ansible_host=worker4 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/.ssh/id_rsa

[k3s_cluster:children]
k3s_control_plane
k3s_workers

[all_nodes:children]
jenkins_master
k3s_cluster

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_become=yes
ansible_become_method=sudo
ansible_become_user=root
k3s_version=stable

