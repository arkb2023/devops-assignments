# Multipass VMs
[controller]
worker1 ansible_host=worker1 ansible_user=ubuntu ansible_ssh_private_key_file=../terraform/modules/ec2/worker1-key.pem

[all_nodes:children]
controller

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
ansible_become=yes
ansible_become_method=sudo
ansible_become_user=root
k3s_version=stable
