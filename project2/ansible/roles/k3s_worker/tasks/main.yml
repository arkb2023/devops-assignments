---
- name: Get token from control plane
  shell: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  delegate_to: worker2
  become: yes
  changed_when: false

- name: Install k3s agent (worker)
  shell: |
    curl -sfL https://get.k3s.io | sh -s - agent \
      --server https://worker2:6443 \
      --token {{ k3s_token.stdout }}
  environment:
    K3S_KUBECONFIG_MODE: "0644"
  become: yes
  args:
    creates: /usr/local/bin/k3s

- name: Wait for agent startup
  pause:
    seconds: 30
