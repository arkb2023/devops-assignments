---
- name: Get private IP for node-ip (control-plane)
  set_fact:
    node_ip: "{{ ansible_default_ipv4.address }}"
  when: inventory_hostname == "worker3"  # Matches your when conditions?

- name: Install k3s server (control plane)
  shell: |
    curl -sfL https://get.k3s.io | sh -s - \
      --disable=traefik \
      --disable=local-storage \
      --cluster-init \
      --flannel-iface={{ flannel_iface }} \
      --node-ip={{ node_ip }}
  environment:
    K3S_KUBECONFIG_MODE: "0644"
  become: yes
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s startup
  pause:
    seconds: 60

- name: Verify Flannel on ens5 (control-plane)
  shell: |
    sudo cat /run/flannel/subnet.env | grep FLANNEL_IFACE || echo "No subnet.env"
  register: flannel_verify_cp
  changed_when: false

- name: Check VXLAN socket (control-plane)
  shell: ss -ulnp | grep 8472
  register: vxlan_check_cp
  changed_when: false

