- name: Get token for workers
  shell: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  changed_when: false
  become: yes

- name: Save token
  set_fact:
    k3s_node_token: "{{ k3s_token.stdout }}"

- name: Create .kube directory (control plane)
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  become: yes
  when: inventory_hostname == "worker3"

- name: Copy kubeconfig to ubuntu home (control plane)
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  become: yes
  when: inventory_hostname == "worker3"
