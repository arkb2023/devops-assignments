[defaults]
inventory = ./inventory/stage2-hosts.ini
roles_path = ./roles
playbook_dir = ./playbooks
host_key_checking = False
retry_files_enabled = False
forks = 10
timeout = 30
log_path = ./logs/ansible.stage2.log
ansible_managed = Ansible managed: {file} modified by {uid} on {host}

# stdout_callback = yaml
# stdout_callback = community.general.yaml
stdout_callback = default
display_skipped_hosts = False
deprecation_warnings = False


# SSH with controller's id_rsa (default)
ssh_args = -o ControlMaster=auto -o ControlPersist=3600s -o StrictHostKeyChecking=no  -o UserKnownHostsFile=/dev/null
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no
control_path = ./ssh_control/control_%h_%p_%r

[galaxy]
server = https://galaxy.ansible.com